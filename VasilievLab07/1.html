<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>ЛР7 — Завдання 1</title>
</head>
<body>
  <h1>Атрибут style</h1>
  <p style="font-size:22px; color:blue">
    Якщо вам необхідно записати невеликі стилі для окремого HTML об'єкта, то можна скористатися простим атрибутом style. У нього можна розміщувати CSS стилі, які будуть використані саме для того об'єкта, у якого ми прописали цей атрибут.
  </p>
</body>
</html>
