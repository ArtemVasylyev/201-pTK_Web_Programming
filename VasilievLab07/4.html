<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>ЛР7 — Самостійна 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
      margin: 20px;
    }
    #main-title {
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      color: #1e3a8a;
      border: 2px solid #1e3a8a;
      padding: 10px;
    }
    .intro {
      font-size: 16px;
      font-style: italic;
      text-indent: 30px;
      text-align: justify;
      color: #334155;
    }
    .highlight {
      text-decoration: underline;
      font-weight: 700;
      color: #b91c1c;
    }
    ul {
      list-style-type: square;
      padding-left: 40px;
    }
  </style>
</head>
<body>
  <h1 id="main-title">Використання CSS-селекторів</h1>
  <p class="intro">
    Каскадні таблиці стилів дозволяють керувати <span class="highlight">шрифтами, кольорами, відступами</span> та вирівнюванням тексту на сторінці, відокремлюючи оформлення від структури HTML.
  </p>
  <ul>
    <li>Селектори тегів</li>
    <li>Селектори класів</li>
    <li>Селектори ідентифікаторів</li>
  </ul>
</body>
</html>
