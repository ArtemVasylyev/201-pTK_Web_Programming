<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Реєстрація</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="page-register">
  <header>
    <h1>Сторінка реєстрації</h1>
    <nav>
      <a href="index.html">Головна</a> |
      <a href="Poltava.html">Моє рідне місто</a>
    </nav>
  </header>

  <main>
    <section>
      <form action="#" method="post">
        <table border="1" cellpadding="5" cellspacing="2" align="center">
          <tr>
            <th colspan="3"><font color="red" size="5">Реєстрація</font></th>
          </tr>
          <tr><td>1</td><td>Прізвище</td><td><input type="text" name="surname" size="40" required></td></tr>
          <tr><td>2</td><td>Ім'я, по-батькові</td><td><input type="text" name="fullname" size="40" required></td></tr>
          <tr><td>3</td><td>Дата, рік народження</td><td><input type="date" name="birthdate"></td></tr>
          <tr><td>4</td><td>Домашня адреса</td><td><input type="text" name="address" size="40"></td></tr>
          <tr><td>5</td><td>Місто роботи(навчання)</td><td><input type="text" name="workplace" size="40"></td></tr>
          <tr><td>6</td><td>Телефон</td><td><input type="tel" name="phone" size="40"></td></tr>
          <tr><td>7</td><td>E-mail</td><td><input type="email" name="email" size="40" required></td></tr>
          <tr><td>8</td><td>Введіть ваш логін</td><td><input type="text" name="login" size="40" required></td></tr>
          <tr><td>9</td><td>Введіть ваш пароль</td><td><input type="password" name="password" size="40" required></td></tr>
          <tr>
            <td>10</td><td>Стать</td>
            <td>
              <input type="radio" name="gender" value="male"> Чоловіча
              <input type="radio" name="gender" value="female"> Жіноча
            </td>
          </tr>
          <tr>
            <td colspan="3">
              <input type="reset" value="Очистити">
              <input type="submit" value="Реєструвати">
              <a href="index.html"><button type="button">Повернутися на головну</button></a>
            </td>
          </tr>
        </table>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Васільєв І.П., група 201-pTK</p>
  </footer>
</body>
</html>
