<!DOCTYPE html>
<html lang="uk">
<head><meta charset="utf-8"><title>ЛР10 — Приклад 1</title></head>
<body>
  <h1>Для навігації у Web ви використовуєте:</h1>
  <ul>
    <script>
      document.write("<li>Ім'я програми: <b>" + navigator.appName + "</b></li>");
      document.write("<li>Версія: <b>" + navigator.appVersion + "</b></li>");
      document.write("<li>Агент користувача: <b>" + navigator.userAgent + "</b></li>");
      document.write("<li>Системна мова: <b>" + (navigator.systemLanguage || navigator.language) + "</b></li>");
      document.write("<li>Мова браузера: <b>" + (navigator.userLanguage || navigator.language) + "</b></li>");
      document.write("<li>Платформа: <b>" + navigator.platform + "</b></li>");
    </script>
  </ul>
</body>
</html>
